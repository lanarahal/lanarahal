<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Lana Rahal</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="logo">lana<span>rahal</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="suggest.html">Suggest</a>
        <a href="links.html">Links</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" style="padding-bottom:16px;">
      <div class="container">
        <h1>Gallery</h1>
        <p>Mini Toads & Mini Faces · Auto-updated when new pieces are minted</p>
        <p id="stats" style="color:var(--text-muted);font-size:0.9rem;"></p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="gallery-grid" id="gallery">
          <div class="empty">Loading gallery...</div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Mini Toads + Mini Faces</p>
      <p style="margin-top:4px;">Last updated: <span id="last-updated">—</span></p>
    </div>
  </footer>

  <script>
    async function load() {
      const grid = document.getElementById('gallery');
      const stats = document.getElementById('stats');
      const last = document.getElementById('last-updated');
      try {
        const res = await fetch('data/nfts.json?t=' + Date.now());
        const data = await res.json();
        const items = data.items || [];
        stats.textContent = items.length + ' piece' + (items.length !== 1 ? 's' : '');
        last.textContent = data.lastUpdated
          ? new Date(data.lastUpdated).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'UTC' }) + ' UTC'
          : '—';

        if (!items.length) {
          grid.innerHTML = '<div class="empty">No works found yet.</div>';
          return;
        }

        items.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

        grid.innerHTML = items.map(item => `
          <article class="card">
            <div class="card-img">
              ${item.image
                ? `<img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=no-img>No image</div>'">`
                : '<div class="no-img">No image</div>'}
            </div>
            <div class="card-body">
              <h3>${item.name || 'Untitled'}</h3>
              <div class="badge">${item.collection || ''}</div>
              <div class="card-links">
                <a href="${item.mallowUrl || 'https://mallow.art/artwork/' + item.id}" target="_blank" rel="noopener">mallow</a>
                <a href="https://www.tensor.trade/item/${item.id}" target="_blank" rel="noopener">Tensor</a>
                <a href="https://solscan.io/token/${item.id}" target="_blank" rel="noopener">Solscan</a>
              </div>
            </div>
          </article>
        `).join('');
      } catch (e) {
        grid.innerHTML = '<div class="empty">Error loading gallery.</div>';
      }
    }
    load();
  </script>
</body>
</html>
