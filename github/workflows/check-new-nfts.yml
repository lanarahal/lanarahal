name: Check for new Mini Toads

on:
  schedule:
    # Every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allow manual runs

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch collection assets and update gallery
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const COLLECTION = 'AE3o4tmcnLHAX1PSSMsRLLnxV3eXAoidXnM7kXwS6cp5';
          const DATA_FILE = path.join('data', 'nfts.json');
          const API_KEY = process.env.HELIUS_API_KEY;

          if (!API_KEY) {
            console.error('❌ HELIUS_API_KEY secret is missing.');
            console.error('Get a free key at https://dev.helius.xyz and add it as a repository secret.');
            process.exit(1);
          }

          async function fetchAllAssets() {
            const items = [];
            let page = 1;
            const limit = 1000;

            while (true) {
              const body = {
                jsonrpc: '2.0',
                id: 'mini-toads',
                method: 'getAssetsByGroup',
                params: {
                  groupKey: 'collection',
                  groupValue: COLLECTION,
                  page,
                  limit,
                  displayOptions: {
                    showCollectionMetadata: true
                  }
                }
              };

              const res = await fetch(
                `https://mainnet.helius-rpc.com/?api-key=${API_KEY}`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body)
                }
              );

              if (!res.ok) {
                throw new Error(`Helius HTTP ${res.status}: ${await res.text()}`);
              }

              const json = await res.json();
              if (json.error) {
                throw new Error(`Helius error: ${JSON.stringify(json.error)}`);
              }

              const result = json.result || {};
              const batch = result.items || [];

              for (const asset of batch) {
                const content = asset.content || {};
                const metadata = content.metadata || {};
                const links = content.links || {};
                const files = content.files || [];

                // Prefer CDN / image from links or first file
                let image = links.image || null;
                if (!image && files.length > 0) {
                  image = files[0].cdn_uri || files[0].uri || null;
                }

                items.push({
                  id: asset.id,
                  name: metadata.name || content.json_uri?.split('/').pop() || 'Untitled',
                  image: image,
                  mallowUrl: `https://mallow.art/artwork/${asset.id}`,
                  addedAt: Date.now() // will keep existing timestamp if already known
                });
              }

              console.log(`Page ${page}: got ${batch.length} items`);

              if (batch.length < limit || items.length >= (result.total || Infinity)) {
                break;
              }
              page++;
            }

            return items;
          }

          async function main() {
            console.log('Fetching assets for Mini Toads...');
            const freshItems = await fetchAllAssets();
            console.log(`Total on-chain: ${freshItems.length}`);

            // Load existing data
            let existing = { items: [], lastUpdated: null };
            if (fs.existsSync(DATA_FILE)) {
              existing = JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'));
            }

            const existingMap = new Map(
              (existing.items || []).map(i => [i.id, i])
            );

            // Merge: keep old addedAt if present, otherwise mark as new
            const merged = freshItems.map(item => {
              const prev = existingMap.get(item.id);
              if (prev) {
                return {
                  ...item,
                  addedAt: prev.addedAt || item.addedAt,
                  name: item.name || prev.name,
                  image: item.image || prev.image
                };
              }
              // brand new
              console.log(`🆕 New piece: ${item.name} (${item.id})`);
              return item;
            });

            // Also keep any items that somehow disappeared (optional safety)
            // We only keep current on-chain items.

            const newData = {
              collection: COLLECTION,
              name: 'Mini Toads',
              lastUpdated: new Date().toISOString(),
              items: merged
            };

            const oldJson = JSON.stringify(existing, null, 2);
            const newJson = JSON.stringify(newData, null, 2);

            if (oldJson === newJson) {
              console.log('No changes detected.');
              process.exit(0);
            }

            fs.writeFileSync(DATA_FILE, newJson + '\n');
            console.log(`Updated ${DATA_FILE} with ${merged.length} items.`);
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/nfts.json; then
            echo "No file changes to commit."
            exit 0
          fi

          git add data/nfts.json
          git commit -m "chore: update Mini Toads gallery ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
