<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggest Next Work — Lana Rahal</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="logo">lana<span>rahal</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="suggest.html" class="active">Suggest</a>
        <a href="links.html">Links</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" style="padding-bottom:12px;">
      <div class="container">
        <h1>Suggest Next Work</h1>
        <p>What should Lana create next? Add your idea and vote for others.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="form-card">
          <div class="form-group">
            <label for="idea">Your suggestion</label>
            <input type="text" id="idea" placeholder="e.g. Mini Toad as a samurai chef..." maxlength="120" />
          </div>
          <button class="btn btn-primary" style="width:100%;" onclick="addSuggestion()">Submit idea</button>
        </div>

        <div class="suggest-list" id="list">
          <!-- filled by JS -->
        </div>

        <p style="text-align:center;margin-top:24px;font-size:0.85rem;color:var(--text-muted);">
          Votes are stored in your browser for now (public demo).<br>
          For a real shared voting system we can connect a free backend later.
        </p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© Lana Rahal</p>
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'lanarahal_suggestions_v1';

    function loadSuggestions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveSuggestions(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function render() {
      const list = loadSuggestions();
      list.sort((a, b) => b.votes - a.votes);
      const el = document.getElementById('list');
      if (!list.length) {
        el.innerHTML = '<div class="empty">No suggestions yet. Be the first!</div>';
        return;
      }
      el.innerHTML = list.map((s, i) => `
        <div class="suggest-item">
          <div class="text">${escapeHtml(s.text)}</div>
          <button class="vote-btn" onclick="vote(${i})">▲ ${s.votes}</button>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function addSuggestion() {
      const input = document.getElementById('idea');
      const text = input.value.trim();
      if (!text) return;
      const list = loadSuggestions();
      list.push({ text, votes: 1, id: Date.now() });
      saveSuggestions(list);
      input.value = '';
      render();
    }

    function vote(index) {
      const list = loadSuggestions();
      if (list[index]) {
        list[index].votes += 1;
        saveSuggestions(list);
        render();
      }
    }

    render();
  </script>
</body>
</html>
