<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="logo">lana<span>rahal</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="suggest.html">Suggest</a>
        <a href="links.html">Links</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" style="padding-bottom:12px;">
      <div class="container">
        <h1>Contact</h1>
        <p>Send a message directly to Lana</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="form-card">
          <!-- 
            Free Formspree setup:
            1. Go to https://formspree.io and create a free account
            2. Create a new form → set email to lanarahal576@gmail.com
            3. Copy the form endpoint (looks like https://formspree.io/f/xxxxxxx)
            4. Replace the action URL below with your endpoint
          -->
          <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <div class="form-group">
              <label for="name">Your name</label>
              <input type="text" id="name" name="name" required placeholder="Name" />
            </div>
            <div class="form-group">
              <label for="email">Your email</label>
              <input type="email" id="email" name="email" required placeholder="you@example.com" />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" required placeholder="Write your message..."></textarea>
            </div>
            <input type="hidden" name="_subject" value="New message from lanarahal.site" />
            <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
          </form>
          <p style="margin-top:16px;font-size:0.85rem;color:var(--text-muted);text-align:center;">
            Messages go to lanarahal576@gmail.com
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© Lana Rahal</p>
    </div>
  </footer>
</body>
</html>
