name: Check new artworks

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch both collections
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const COLLECTIONS = [
            { id: 'AE3o4tmcnLHAX1PSSMsRLLnxV3eXAoidXnM7kXwS6cp5', name: 'Mini Toads' },
            { id: '2nxF1CUDT2ffdTbcV9qYp2gQrN1xLB6H6Wu6eeGDgV9M', name: 'Mini Faces' }
          ];
          const DATA_FILE = path.join('data', 'nfts.json');
          const API_KEY = process.env.HELIUS_API_KEY;

          if (!API_KEY) {
            console.error('HELIUS_API_KEY missing');
            process.exit(1);
          }

          const heliusUrl = `https://mainnet.helius-rpc.com/?api-key=${API_KEY}`;

          async function helius(method, params) {
            const res = await fetch(heliusUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: '1', method, params })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (json.error) throw new Error(JSON.stringify(json.error));
            return json.result;
          }

          async function getAssetsByGroup(collectionId) {
            const items = [];
            let page = 1;
            while (true) {
              try {
                const result = await helius('getAssetsByGroup', {
                  groupKey: 'collection',
                  groupValue: collectionId,
                  page,
                  limit: 1000
                });
                const batch = result?.items || [];
                items.push(...batch);
                if (batch.length < 1000) break;
                page++;
              } catch (e) {
                console.warn('getAssetsByGroup failed for', collectionId, e.message);
                break;
              }
            }
            return items;
          }

          function parseAsset(asset, collectionName, collectionId) {
            if (!asset) return null;
            const content = asset.content || {};
            const metadata = content.metadata || {};
            const links = content.links || {};
            const files = content.files || [];
            let image = links.image || null;
            if (!image && files.length) image = files[0].cdn_uri || files[0].uri || null;
            return {
              id: asset.id,
              name: metadata.name || 'Untitled',
              image,
              mallowUrl: `https://mallow.art/artwork/${asset.id}`,
              collection: collectionName,
              collectionId,
              addedAt: Date.now()
            };
          }

          async function main() {
            let existing = { items: [] };
            if (fs.existsSync(DATA_FILE)) {
              existing = JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'));
            }
            const existingMap = new Map((existing.items || []).map(i => [i.id, i]));

            const allItems = [];
            for (const col of COLLECTIONS) {
              console.log('Fetching', col.name, '...');
              const assets = await getAssetsByGroup(col.id);
              console.log('  found', assets.length);
              for (const a of assets) {
                const parsed = parseAsset(a, col.name, col.id);
                if (!parsed) continue;
                const prev = existingMap.get(parsed.id);
                if (prev) {
                  parsed.addedAt = prev.addedAt || parsed.addedAt;
                  parsed.image = parsed.image || prev.image;
                  parsed.name = parsed.name || prev.name;
                } else {
                  console.log('  NEW:', parsed.name, parsed.id);
                }
                allItems.push(parsed);
              }
            }

            for (const [id, old] of existingMap) {
              if (!allItems.find(i => i.id === id)) {
                allItems.push(old);
              }
            }

            allItems.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

            const newData = {
              name: 'Lana Rahal Collections',
              collections: COLLECTIONS,
              lastUpdated: new Date().toISOString(),
              items: allItems
            };

            fs.writeFileSync(DATA_FILE, JSON.stringify(newData, null, 2) + '\n');
            console.log('Total items written:', allItems.length);
          }

          main().catch(e => { console.error(e); process.exit(1); });
          SCRIPT

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/nfts.json; then
            echo "No changes"
            exit 0
          fi
          git add data/nfts.json
          git commit -m "chore: update gallery ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
