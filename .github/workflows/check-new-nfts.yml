name: Check for new Mini Toads

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch collection assets and update gallery
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const COLLECTION = 'AE3o4tmcnLHAX1PSSMsRLLnxV3eXAoidXnM7kXwS6cp5';
          const DATA_FILE = path.join('data', 'nfts.json');
          const API_KEY = process.env.HELIUS_API_KEY;

          // Known mints (seed + fallback when DAS group is empty)
          const KNOWN_MINTS = [
            'BadyACT9LQenuwZAY8t7V5Mqu5R8aj7V1wM7RkWYDU9A',
            '73SF3H7HmerW9FBiYfaihzst62WJaU1sV2jv4btoT8gv',
            'F5bmWQLV3YUsNWLXczevKtQ8cLZ6pcYY8RKtU8HtQud8',
            'BmFTTEoR59C1rPfBv7XKy3DBUqWFHym5JgYVpzz4dmaq'
          ];

          if (!API_KEY) {
            console.error('❌ HELIUS_API_KEY secret is missing.');
            console.error('Get a free key at https://dev.helius.xyz → create key → add as repo secret HELIUS_API_KEY');
            process.exit(1);
          }

          const heliusUrl = `https://mainnet.helius-rpc.com/?api-key=${API_KEY}`;

          async function helius(method, params) {
            const res = await fetch(heliusUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: '1', method, params })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (json.error) throw new Error(JSON.stringify(json.error));
            return json.result;
          }

          async function getAssetsByGroup(groupKey) {
            const items = [];
            let page = 1;
            while (true) {
              const result = await helius('getAssetsByGroup', {
                groupKey,
                groupValue: COLLECTION,
                page,
                limit: 1000
              });
              const batch = result?.items || [];
              items.push(...batch);
              console.log(`  ${groupKey} page ${page}: ${batch.length}`);
              if (batch.length < 1000) break;
              page++;
            }
            return items;
          }

          async function getAsset(id) {
            try {
              return await helius('getAsset', { id });
            } catch (e) {
              console.warn(`  getAsset failed for ${id}:`, e.message);
              return null;
            }
          }

          function parseAsset(asset) {
            if (!asset) return null;
            const content = asset.content || {};
            const metadata = content.metadata || {};
            const links = content.links || {};
            const files = content.files || [];
            let image = links.image || null;
            if (!image && files.length) {
              image = files[0].cdn_uri || files[0].uri || null;
            }
            return {
              id: asset.id,
              name: metadata.name || 'Untitled',
              image,
              mallowUrl: `https://mallow.art/artwork/${asset.id}`,
              addedAt: Date.now()
            };
          }

          async function main() {
            console.log('=== Mini Toads updater ===');
            let onChain = [];

            // 1. Try collection key
            console.log('Trying groupKey=collection ...');
            try {
              onChain = await getAssetsByGroup('collection');
            } catch (e) {
              console.warn('collection failed:', e.message);
            }

            // 2. Try group key (Core groups)
            if (onChain.length === 0) {
              console.log('Trying groupKey=group ...');
              try {
                onChain = await getAssetsByGroup('group');
              } catch (e) {
                console.warn('group failed:', e.message);
              }
            }

            // 3. Fallback: refresh known mints + any already in json
            console.log(`On-chain via group: ${onChain.length}`);
            let existing = { items: [] };
            if (fs.existsSync(DATA_FILE)) {
              existing = JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'));
            }
            const existingIds = new Set((existing.items || []).map(i => i.id));
            const allIds = new Set([...KNOWN_MINTS, ...existingIds, ...onChain.map(a => a.id)]);

            console.log(`Refreshing ${allIds.size} assets individually...`);
            const mergedMap = new Map();

            // Keep old addedAt
            for (const old of existing.items || []) {
              mergedMap.set(old.id, { ...old });
            }

            for (const id of allIds) {
              const asset = await getAsset(id);
              const parsed = parseAsset(asset);
              if (parsed) {
                const prev = mergedMap.get(id);
                mergedMap.set(id, {
                  ...parsed,
                  addedAt: prev?.addedAt || parsed.addedAt,
                  name: parsed.name || prev?.name || 'Untitled',
                  image: parsed.image || prev?.image || null
                });
                if (!prev) console.log(`🆕 New: ${parsed.name} (${id})`);
              }
            }

            const items = Array.from(mergedMap.values());
            items.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

            const newData = {
              collection: COLLECTION,
              name: 'Mini Toads',
              lastUpdated: new Date().toISOString(),
              items
            };

            fs.writeFileSync(DATA_FILE, JSON.stringify(newData, null, 2) + '\n');
            console.log(`✅ Wrote ${items.length} items to ${DATA_FILE}`);
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          SCRIPT

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/nfts.json; then
            echo "No changes to commit."
            exit 0
          fi

          git add data/nfts.json
          git commit -m "chore: update Mini Toads gallery ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
